version: 1
checks:
  - name: no-external-calls-in-transactions
    filters:
      paths: ["server/src/**"]
      file_types: [typescript]
    steps:
      - aql:
          name: integrations-run-outside-transactions
          comment: Emails and payment-provider calls run after the transaction commits, never while it holds a database connection and row locks.
          query: |
            let transaction = functions().filterInFileWithName("src/db/transaction.ts").filterNameExact("withTransaction")
            let outside = functions().filterInFileWithName("src/integrations/*")
            assertNotEmpty(transaction)
            assertNotEmpty(outside)
            duringCallsTo(transaction).assertNeverCalls(outside)
      - aql:
          name: transactions-go-through-withTransaction
          comment: Only withTransaction takes a connection from the pool, so every transaction commits or rolls back and releases its connection.
          query: |
            let connect = functions().filterInFileWithName("src/db/pool.ts").filterNameExact("connect")
            let transaction = functions().filterInFileWithName("src/db/transaction.ts").filterNameExact("withTransaction")
            assertNotEmpty(connect.callers())
            assertSubset(connect.callers(), transaction)
